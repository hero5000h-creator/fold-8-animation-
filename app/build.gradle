plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hanooot.foldanim'
    compileSdk 34

    defaultConfig {
        applicationId "com.hanooot.foldanim"
        minSdk 30          // Sensor.TYPE_HINGE_ANGLE requires API 30+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Fallback / more reliable posture detection across foldable brands.
    // Use FoldingFeature from this if Sensor.TYPE_HINGE_ANGLE isn't available
    // on a given device.
    implementation 'androidx.window:window:1.3.0'
}
